name: Background scan

# Plan-independent scheduler: pings the deployed rotating-scan endpoint so the
# dashboard fills continuously, regardless of Vercel plan cron limits.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   SCAN_URL     e.g. https://your-app.vercel.app/api/cron/scan
#   CRON_SECRET  the same value set as CRON_SECRET in Vercel
on:
  schedule:
    - cron: '*/15 * * * *'   # rotating scan every 15 minutes
    - cron: '0 3 * * *'      # daily universe refresh (discovery)
  workflow_dispatch: {}

concurrency:
  group: background-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger rotating scan
        env:
          SCAN_URL: ${{ secrets.SCAN_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SCAN_URL" ]; then
            echo "SCAN_URL secret is not set"; exit 1
          fi
          # The 03:00 UTC run also refreshes discovery.
          if [ "${{ github.event.schedule }}" = "0 3 * * *" ]; then
            URL="${SCAN_URL}?batch=15&discover=1"
          else
            URL="${SCAN_URL}?batch=10"
          fi
          echo "POST $URL"
          curl -fsS -X POST "$URL" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            --max-time 120 | head -c 2000
